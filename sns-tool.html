<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>국회의원 SNS 모니터링 - v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--line:rgba(0,0,0,.10);--line-soft:rgba(0,0,0,.07);--bg:#f7f7f6;--ink:#202124;--faint:#5F6368;--blue:#18181b;--blue-soft:rgba(0,0,0,.06)}
*{box-sizing:border-box} body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:700;margin:0} .count{font-size:12px;color:var(--faint)}
#q{flex:1;min-width:200px;max-width:380px;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 16px;font-size:13px;outline:none;background:var(--bg);box-sizing:border-box} #q:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.btn{height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px;font-size:12.5px;cursor:pointer;font-weight:500;box-sizing:border-box} .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)} .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600} .btn.danger{color:#C5221F;border-color:#F5C6C4} .btn.danger:hover{background:#FCE8E6}
/* PC 헤더 통합 모드: 부모의 고정 검색 줄 대신 이 검색 줄을 맨 위에 보이게 — 스크롤과 함께 올라감 (2026-09-24) */
body.inline-search .header{display:flex!important;position:static;border-bottom:none;background:none;backdrop-filter:none;justify-content:flex-end;gap:8px;align-items:center;padding:14px 20px 0}
body.inline-search #homeTitle,body.inline-search #totalCount{display:none}
.filters{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:#fff}
.fRow{display:flex;flex-wrap:wrap;gap:7px;align-items:center} .fIco{color:var(--faint);width:17px;height:17px;flex-shrink:0}
.fDivider{width:1px;height:22px;background:var(--line);flex-shrink:0;margin:0 1px}
.regSel{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:13px;background:#fff;cursor:pointer;max-width:160px;box-sizing:border-box}
.regAddBtn{height:32px;font-size:13px;padding:0 14px;box-sizing:border-box}
.regChip{height:32px;box-sizing:border-box;border:1px solid transparent;border-radius:8px;background:var(--blue-soft);color:var(--ink);padding:0 6px 0 10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.regChip .rx{cursor:pointer;font-size:14px;color:var(--ink);opacity:.55;padding:0 4px} .regChip .rx:hover{opacity:1}
.fTag{height:32px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 13px;font-size:13px;font-weight:500;color:var(--faint);cursor:pointer;display:flex;align-items:center;gap:6px} .fTag.on{background:var(--blue);border-color:transparent;color:#fff}
.fTag .cnt{background:var(--bg);color:#80868b;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600;min-width:18px;text-align:center} .fTag.on .cnt{background:rgba(255,255,255,.22);color:#fff}
/* coss ui Radio(https://coss.com/ui/docs/components/radio-group) 규격: 16px 원형 + 체크 시 안쪽에 작은 흰 점 */
.tierRadio{height:32px;box-sizing:border-box;background:none;border:none;padding:0 10px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--faint)}
.tierRadio:hover{color:var(--ink)}
.tierRadio.on{color:var(--ink);font-weight:600}
.tierRadio::before{
  content:"";width:16px;height:16px;border-radius:50%;flex-shrink:0;box-sizing:border-box;
  border:1px solid rgba(0,0,0,.18);background:#fff;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);
  transition:background .12s,border-color .12s;
}
.tierRadio.on::before{
  border-color:var(--ink);
  background:radial-gradient(circle at center, #fff 0 3px, var(--ink) 3.5px 100%);
}
.tierRadio .cnt{background:#F1F3F4;color:#80868b;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600} .tierRadio.on .cnt{background:var(--blue-soft);color:var(--ink)}
#stat{padding:9px 20px;font-size:13px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:nowrap;overflow-x:auto;min-height:44px;border-bottom:1px solid var(--line);background:#fff} #stat b{color:var(--ink);font-weight:700}
#stat .statResult{flex-shrink:0;font-weight:600}
#bulkEdit{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;flex-shrink:0}
#bulkEdit input, #bulkEdit select{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:12.5px;background:#fff}
#bulkEdit .bulkDiv{width:1px;height:20px;background:var(--line);flex-shrink:0}
#bulkEdit .bulkSelToggle{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap;flex-shrink:0}
#bulkEdit .bulkSelToggle input{width:15px;height:15px;margin:0;cursor:pointer}
#bulkEdit .bulkActs{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;transition:opacity .15s}
#bulkEdit .bulkActs.off{opacity:.38;pointer-events:none}
#bulkEdit .bulkTagIn{width:100px}
#bulkEdit .btn.sm{height:30px;padding:0 10px;font-size:12px}
#bulkEdit #bulkFeedBtn{flex-shrink:0;margin-left:2px}
#bulkTagBtn{background:#e8f4fd;border-color:#bfe0f7}
#bulkTagBtn:hover{background:#d9ecfb}
@media(max-width:768px){
  body{overflow-x:hidden}
  #stat{flex-direction:column;align-items:stretch;gap:9px;overflow-x:visible}
  #stat .statResult{align-self:flex-start}
  #bulkEdit{flex-wrap:wrap;width:100%;gap:8px}
  #bulkEdit .bulkDiv{display:none}
  #bulkEdit .bulkSelToggle{width:100%}
  #bulkEdit .bulkActs{width:100%;flex-wrap:wrap;gap:8px}
  #bulkEdit .bulkTagIn{flex:1 1 120px;min-width:0}
  #bulkEdit #bulkTierSel{flex:1 1 120px}
  #bulkEdit #bulkFeedBtn{width:100%;margin-left:0}
  .sidoResetBtn{width:100%}
  .filters{padding:12px}
}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;padding:14px 18px 40px;perspective:1000px;min-height:120px}
.emptyMsg{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--faint);font-size:14px;line-height:1.6;background:#F8F9FA;border:1px dashed var(--line);border-radius:12px;margin:20px}
.flip{position:relative;min-height:160px} .flipInner{position:relative;width:100%;min-height:160px;transition:transform .45s;transform-style:preserve-3d} .flip.flipped .flipInner{transform:rotateY(180deg)}
.cardFront, .cardBack{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;min-height:160px}
.cardFront{min-height:160px;display:flex;align-items:flex-start;gap:12px;padding:11px 40px 11px 0;cursor:pointer} .cardFront::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--party-color,#888);border-radius:12px 0 0 12px}
.cardFront:hover{border-color:var(--line);box-shadow:0 1px 8px rgba(0,0,0,.10)} .flip.on .cardFront{border-color:var(--ink);background:var(--bg)}
.cardFront .ph{width:50px;height:50px;border-radius:50%;background:#F8F9FA;flex-shrink:0;margin-left:14px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--faint);border:1px solid var(--line)}
.cardFront .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px} .cardFront .row1{display:flex;align-items:center;gap:6px} .cardFront .nm{font-size:14.5px;font-weight:600;color:var(--ink)} .cardFront .tierCircle{font-size:12px;line-height:1;color:var(--faint);margin-left:2px} 
.cardFront .sns{display:flex;gap:6px;align-items:center;margin:4px 0 2px 0;justify-content:flex-start} .cardFront .sns a{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fff;border:1px solid transparent} .cardFront .sns a:hover{background:var(--bg);border-color:var(--line)}
.cardFront .sns a.fb svg{width:14px;height:14px;fill:#1877F2} .cardFront .sns a.x svg{width:13px;height:13px;fill:#000} .cardFront .sns a.wiki{font-size:11px;font-weight:800;color:#000;background:#F1F3F4;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.cardFront .row2{font-size:13.5px;color:#3C4043;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;min-height:40px;margin:2px 0 4px 0}
.cardFront .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;justify-content:flex-start;align-content:flex-start} .cardFront .tag{height:22px;border:none;border-radius:6px;padding:0 7px 0 9px;font-size:11px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft)} .cardFront .tag .x{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.12);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer}
.cardFront input[type=checkbox]{position:absolute;top:10px;right:10px;width:18px;height:18px;z-index:5;accent-color:var(--ink);cursor:pointer}
.cardBack{transform:rotateY(180deg);padding:11px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);overflow:auto} .cardBack .backName{font-size:13.5px;font-weight:700} .cardBack .field{display:flex;gap:8px;align-items:center} .cardBack label{font-size:11px;color:var(--faint);width:36px;flex-shrink:0;font-weight:600} .cardBack input, .cardBack textarea, .cardBack select{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;outline:none;background:#fff} .cardBack textarea{resize:none;height:42px} .cardBack .hint{font-size:10px;color:var(--faint)}
#bottomFeed{display:none;background:var(--bg);border-top:1px solid var(--line);padding:0 0 32px}
#recentTitle{font-size:14px;font-weight:700;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.feedModeTabs{display:flex;gap:4px}
.fmTab{border:1px solid var(--line);background:#fff;color:var(--faint);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.fmTab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.feedSubTitle{padding:14px 20px 4px;font-size:13px;font-weight:600;color:var(--faint);max-width:1100px;margin:0 auto}
.xFeedEmpty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.8}
.xFeedErrRow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.xFeedAsk{max-width:640px;margin:20px auto;padding:0 20px}
.xFeedNote{font-size:12px;color:var(--faint);line-height:1.6;margin:6px 0 14px}
.xFeedNote code{background:var(--bg);padding:1px 6px;border-radius:5px}
.xFeedAskRow{display:flex;gap:8px;align-items:center}
.xFeedAskRow input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
.xFeedAskRow input#xFeedTopicInput{flex:1}
.xFeedAskRow input.errShake{animation:xfShake .4s;border-color:#C5221F}
.xFeedAskRow input:disabled{opacity:.55}
.xFeedAskRow .btn:disabled{opacity:.55;cursor:default}
.xFeedBarNote{font-size:11.5px;color:var(--faint);white-space:nowrap}
@keyframes xfShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.xFeedErr{color:#C5221F;font-size:12.5px;margin-top:8px}
.xFeedPending{max-width:640px;margin:40px auto;padding:0 20px;text-align:center;font-size:13.5px;color:var(--ink)}
.xFeedSpinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 14px;animation:xfSpin .8s linear infinite}
@keyframes xfSpin{to{transform:rotate(360deg)}}
.xFeedPendingNote{font-size:12px;color:var(--faint);margin-top:8px}
.xFeedPendingBtns{margin-top:14px;display:flex;gap:8px;justify-content:center}
.xfSection{max-width:900px;margin:0 auto 22px;padding:0 20px}
.xfSection.xfExchange .xfSectionTitle{color:#C5221F}
.xfSectionTitle{font-size:13px;font-weight:700;color:var(--faint);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.xfCnt{font-weight:500;color:var(--faint)}
.xfPost{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}
.xfPostHead{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
.xfPostDate{margin-left:auto;color:var(--faint);font-size:11.5px}
.xfArrow{color:#C5221F;font-weight:600;font-size:12.5px}
.xfPostText{font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-bottom:8px}
.xfPostFoot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--faint)}
.xfPostFoot a{color:var(--blue);text-decoration:none}
.xfPostFoot a:hover{text-decoration:underline}
.xfAiBlock{max-width:900px;margin:0 auto 22px;padding:0 20px}
.xfAiLoading{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--faint)}
.xfAiLoading .xFeedSpinner{width:16px;height:16px;margin:0;border-width:2px}
.xfAiErr{margin-top:12px;color:#C5221F;font-size:12.5px}
.xfAiText{margin-top:14px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.8;white-space:pre-wrap}
.feedHead{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:center} .feedHead .who{font-size:13px;font-weight:700} .feedHead .party{font-size:11px;color:var(--faint)}
.feedBody{padding:0 14px 12px;font-size:13px;line-height:1.6;color:var(--ink);word-break:break-word} .feedMeta{font-size:11px;color:var(--faint);padding:0 14px 10px}
.feedClip{overflow:hidden;background:#fff;max-height:700px;min-height:120px} .feedClip iframe{width:100%;border:0;display:block;overflow:hidden}
.feedItem{height:auto}
.feedItem .feedClip{box-sizing:border-box;overflow:hidden}
.feedClip::-webkit-scrollbar{display:none}
.feedClip{scrollbar-width:none;-ms-overflow-style:none}

.feedFooter{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:#FAFBFB}
.checkedBtn{height:24px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:11px;padding:0 10px;cursor:pointer;color:var(--faint)}
.hideBtnGroup{display:inline-flex;gap:0;margin-left:auto} .hideBtn{height:24px;border:1px solid var(--line);background:#fff;font-size:10.5px;padding:0 10px;cursor:pointer;color:#8B95A1;border-right-width:0} .hideBtn:first-child{border-radius:6px 0 0 6px} .hideBtn:last-child{border-radius:0 6px 6px 0;border-right-width:1px} .hideBtn:hover{background:#FFF4CE;color:#B45309;border-color:#F5C878;position:relative;z-index:1}

#midBar{display:none;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line);gap:8px;align-items:center;flex-wrap:wrap}
#midBar.show{display:flex}
#midBar input, #midBar select{height:32px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:12.5px;background:#fff}
.rgSido{color:#5F6368;transition:color .15s}
.rgSido:hover{color:var(--ink);text-decoration:underline}
.rgProp{cursor:pointer}
.sidoResetBtn{height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#5F6368;padding:0 14px;font-size:12.5px;cursor:pointer;font-weight:500;flex-shrink:0;white-space:nowrap}
.sidoResetBtn:hover{background:var(--bg);color:var(--ink);border-color:var(--ink)}
#homeTitle{cursor:pointer}

.feedItem{transition:opacity .2s}

/* feed - 스크롤 원천 차단 + 우측 여백 제거 */







.feedItem.hiddenFB{display:none !important}



.masonryGrid{display:none}














#bottomFeed{background:var(--bg);border-top:1px solid var(--line);padding:0 0 40px}
.bottomFeedInner{max-width:1100px;margin:0 auto;padding:16px}
.masonry2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:768px){.masonry2{grid-template-columns:1fr}}
.memberCard{display:flex;flex-direction:column;width:100%;height:700px;margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:opacity .2s}
.memberCard.hiddenEmpty{display:none !important}
.memberCardHead{flex:0 0 auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
/* 좁은 화면: 카드 헤더 "한 달" 버튼 숨김(오터치 방지) */
@media(max-width:640px){
  .memberCardHead .hideBtnGroup .hideBtn:nth-child(3){display:none}
}
.memberCardBody{flex:1;min-height:0;width:100%;overflow:hidden;background:#fff;position:relative}
.mcbFallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;background:#fff;color:#9AA0A6;font-size:12px}
.mcbFail{font-size:12.5px;color:#6B7280;line-height:1.5}
.memberCardBody .fb-page{position:relative;z-index:1}
.memberCardBody .fb-page, .memberCardBody .fb-page span, .memberCardBody .fb-page iframe{width:100% !important;max-width:100% !important}
/* FB 페이지 플러그인 자체 헤더(프로필 사진·팔로우 버튼·팔로워수·좋아요바)를 잘라내고
   첫 게시물의 헤더(이름·N시간 전·f 로고)부터 보이게. FB 임베드라 로컬 확인 불가 —
   첫 게시물 이름이 잘리면 margin-top 절대값을 줄이고, 플러그인 헤더가 보이면 늘린다. */
.memberCardBody .fb-page iframe{margin-top:-90px !important;height:1000px !important}
/* iframe 자체가 안 생긴 = 확실한 실패 → 카드를 안내 높이로 축소 */
.memberCard.mcbFailed{height:auto}
.memberCard.mcbFailed .memberCardBody{flex:0 0 auto;overflow:visible}
.memberCard.mcbFailed .mcbFallback{position:static;padding:20px 16px}
.memberCardFoot{padding:8px 12px;display:flex;justify-content:flex-end;align-items:center;border-top:1px solid var(--line);background:#FAFBFB;font-size:12px}
.memberCardFoot a{color:#1877F2;text-decoration:none;font-weight:600}
.memberCardFoot a:hover{text-decoration:underline}
/* 개인 계정 카드 — Page Plugin 임베드 불가. 안내 + 방문 버튼 + 최신 글 텍스트. 높이 auto. */
.memberCard.profileCard{height:auto}
.profileCardBody{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;background:#fff}
.profileNotice{font-size:12.5px;color:#6B7280;line-height:1.6;background:#F8F9FA;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.profileVisitBtn{align-self:flex-start;text-decoration:none;font-size:12.5px;font-weight:700;color:#fff;background:#1877F2;border:none;border-radius:9px;padding:9px 16px;cursor:pointer}
.profileVisitBtn:hover{background:#166fe0}
.profilePosts{display:flex;flex-direction:column;gap:9px}
.profilePosts .ppLoading,.profilePosts .ppNote{font-size:12px;color:#9AA0A6;padding:2px 0}
.profilePost{font-size:12.5px;color:#202124;line-height:1.65;white-space:pre-wrap;word-break:break-word;border-left:2px solid #E4E6EB;padding:2px 0 2px 11px}
.profilePost + .profilePost{border-top:1px dashed #EDEFF2;padding-top:9px}
.profilePostsHead{font-size:11.5px;font-weight:700;color:#8B95A1;letter-spacing:.02em}


/* 뒤집어도 페북 로고 안뜸 수정 + 빈카드 숨김 */
.cardFront .sns{position:relative;z-index:4}

<script>
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
let db=null; let firestoreStatus='connected'; let lastChangedRows=new Set(); let saveDebounceTimer=null; let _userManuallyCleared=false;
try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){ console.warn(e); }
// Firestore 규칙: 로그인 + sns_allow/{uid} 명단에 있어야 읽기·쓰기 가능(2026-09-29).
// 정글 본체와 같은 origin이라 본체의 구글 로그인 세션을 그대로 이어받는다. 로그인 안 돼 있으면 DB 미사용.
let snsAuthBlocked=false;
const authReady = new Promise(res=>{
  if(!db){ res(null); return; }
  try{
    const off=firebase.auth().onAuthStateChanged(u=>{ off(); if(!u){ db=null; snsAuthBlocked=true; } res(u); });
  }catch(e){ console.warn(e); res(null); }
});
// 계정별 데이터 분리: 메인 앱(app.js)이 localStorage에 심어준 uid로 Firestore 경로를 네임스페이스.
// uid 없으면(비로그인·구세션) 'shared' = 기존 팀 공유 컬렉션 그대로 사용(하위호환).
let SNS_NS = 'shared';
try{ SNS_NS = localStorage.getItem('jungle_sns_client') || 'shared'; }catch(e){}
function politiciansCol(){
  return SNS_NS==='shared' ? db.collection('politicians')
                            : db.collection('sns_u').doc(SNS_NS).collection('politicians');
}
// 객관 정보(페이스북·X·위키·사진·상임위 등)는 모든 고객사가 함께 쓰는 공유 컬렉션.
// 한 곳(예: sunnydesk)에서 고치면 root/politicians 에 저장 → 다른 고객사도 다음 동기화에 반영.
// 주관 정보(계파 태그·티어·메모·피드 숨김)만 sns_u/{고객사}/politicians 에 고객사별로 남는다.
const SHARED_FIELDS = ['fb','x','wiki','ph'];
function sharedPoliticiansCol(){ return db.collection('politicians'); }

// 일회성: 분리 이전에 각 고객사 칸에만 있던 FB/X/위키/사진을 공유 컬렉션으로 승격.
// sunnydesk를 원본으로 삼는다.
async function migrateSharedFieldsOnce(){
  if(SNS_NS!=='sunnydesk' || !db) return;
  const flagRef = db.collection('sns_u').doc(SNS_NS);
  try{
    const flag = await flagRef.get();
    if(flag.exists && flag.data() && flag.data()._sharedFieldsMigrated) return;
    const cli = await db.collection('sns_u').doc(SNS_NS).collection('politicians').get();
    let batch = db.batch(), n = 0;
    for(const d of cli.docs){
      const s = d.data(), out = {};
      SHARED_FIELDS.forEach(f=>{ if(s[f]!==undefined && s[f]!=='') out[f]=s[f]; });
      if(!Object.keys(out).length) continue;
      out.name = s.name || d.id; out.id = d.id;
      out.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      batch.set(sharedPoliticiansCol().doc(d.id), out, {merge:true});
      if(++n % 400 === 0){ await batch.commit(); batch = db.batch(); n = 0; }
    }
    if(n) await batch.commit();
    await flagRef.set({_sharedFieldsMigrated:true, _sharedFieldsMigratedAt:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    console.log('[shared migrate] sunnydesk의 FB/X/위키/사진 → 공유 politicians 반영 완료');
  }catch(e){ console.warn('[shared migrate] 실패(계속 진행)', e); }
}
// 계정 첫 진입 시 팀 공유 데이터(politicians)를 이 계정 칸으로 1회 복사(시드).
async function seedSnsIfNeeded(){
  if(SNS_NS==='shared' || !db) return;
  const flagRef = db.collection('sns_u').doc(SNS_NS);
  try{
    const flag = await flagRef.get();
    if(flag.exists && flag.data() && flag.data()._seeded) return;
    const shared = await db.collection('politicians').get();
    let batch = db.batch(), n = 0, committed = 0;
    for(const d of shared.docs){
      // 주관 정보(계파·티어·메모)만 고객사 칸으로 시드. 객관 정보(FB·X·위키·사진)는 공유 컬렉션에서 직접 읽는다.
      const s = d.data();
      batch.set(politiciansCol().doc(d.id), {
        factions: s.factions!==undefined ? s.factions : (s.fac||[]),
        tier: s.tier||'', memo: s.memo||'',
        name: s.name||d.id, id: d.id
      }, {merge:true});
      if(++n % 400 === 0){ await batch.commit(); committed += n; batch = db.batch(); n = 0; }
    }
    if(n) await batch.commit();
    await flagRef.set({_seeded:true, _seededAt:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    console.log('[SNS seed] 팀 공유 '+shared.size+'건 → 계정 칸 복사 완료');
  }catch(e){ console.warn('[SNS seed] 실패(계속 진행)', e); }
}
</script>

const SIDOS=['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
function parseRg(rg, isProp){
  if(isProp || !rg || rg.trim()==='' || rg==='비례대표') return {sido:null, rest:'비례대표', isProp:true, raw:'비례대표'};
  let trimmed=rg.trim();
  for(let s of SIDOS){
    if(trimmed===s) return {sido:s, rest:'', isProp:false, raw:trimmed};
    if(trimmed.startsWith(s+' ')){
      return {sido:s, rest:trimmed.slice(s.length+1).trim(), isProp:false, raw:trimmed};
    }
  }
  return {sido:null, rest:trimmed, isProp:false, raw:trimmed};
}
function getSido(rg,isProp){return parseRg(rg,isProp).sido;}

/* ── 지역 필터 (시/도 → 시/군/구 2단 드롭다운 + 체크박스 칩) ────────────────
   각 의원의 m.region = "서울 중랑구갑" 형태(이글아이 데이터 기반). 비례대표는 region 없음. */
function splitRegion(region){
  if(!region || region==='비례대표') return null;
  if(region.indexOf('세종')===0) return {sido:'세종', gugun:region};   // "세종특별자치시갑" 등 통째로
  const sp = region.indexOf(' ');
  if(sp<0) return {sido:region, gugun:''};
  return {sido:region.slice(0,sp), gugun:region.slice(sp+1)};
}
function regionTree(){
  const tree={};
  D.members.forEach(m=>{
    const s=splitRegion(m.region);
    if(!s) return;
    (tree[s.sido]=tree[s.sido]||new Set()).add(s.gugun||'(시/도 전체)');
  });
  return tree;
}
function buildRegionFilter(){
  const sel=$('regionSel'); if(!sel) return;
  const tree=regionTree();
  const order=SIDOS.filter(s=>tree[s]);
  sel.innerHTML='<option value="">지역 선택</option>'+order.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('');
  sel.onchange=function(){
    const key=sel.value; if(!key) return;
    if(!F.region.includes(key)) F.region.push(key);
    hasFiltered=true;
    sel.value='';
    renderRegionChips(); draw();
  };
  renderRegionChips();
}
function renderRegionChips(){
  const box=$('regionChips'); if(!box) return;
  box.innerHTML=F.region.map(r=>'<span class="regChip"><input type="checkbox" checked data-region="'+esc(r)+'" style="margin-right:2px">'+esc(r)+'<span class="rx" data-region-rm="'+esc(r)+'">×</span></span>').join('');
  box.querySelectorAll('[data-region-rm]').forEach(el=>{el.onclick=function(){F.region=F.region.filter(x=>x!==el.dataset.regionRm);renderRegionChips();draw();};});
  box.querySelectorAll('input[data-region]').forEach(cb=>{cb.onclick=function(){ if(!cb.checked){F.region=F.region.filter(x=>x!==cb.dataset.region);} renderRegionChips();draw(); };});
}
function memberInRegion(m){
  if(!F.region.length) return true;
  const s=splitRegion(m.region);
  if(!s) return false;   // 비례대표는 지역 필터 걸면 제외
  return F.region.includes(s.sido);   // 광역시도 단위로만 매칭
}

// Facebook Page Plugin은 '페이지'만 임베드 가능 — 개인 프로필 URL은 무조건 하얀 빈 박스가 된다.
// profile.php · /people/ · 점 들어간 vanity(firstname.lastname[.NNN]) 는 개인 프로필로 보고 아예 렌더 안 함.
function isEmbeddableFb(url){
  if(!url) return false;
  let path;
  try{ path = new URL(url, 'https://www.facebook.com').pathname.replace(/^\/+|\/+$/g,''); }
  catch(e){ path = String(url); }
  if(!path) return false;
  if(/^profile\.php/i.test(path)) return false;
  if(/^(people|pages)\//i.test(path)) return false;
  let seg = path.split('/')[0];
  if(seg.includes('.')) return false;   // 개인 프로필 vanity (FB 페이지는 점을 거의 안 씀)
  return true;
}
const FB_WORKER = 'https://naver-news-proxy.YOUR-ACCOUNT.workers.dev';
// FB URL에서 프로필 식별자(vanity 또는 profile.php id) 추출
function fbVanity(url){
  try{
    const u = new URL(url, 'https://www.facebook.com');
    const id = u.searchParams.get('id');
    if(/profile\.php/i.test(u.pathname) && id) return id;
    let seg = u.pathname.replace(/^\/+|\/+$/g,'').split('/')[0];
    return seg || '';
  }catch(e){ return ''; }
}

function snapshotMember(m){
  return {fac:Array.isArray(m.fac)?m.fac.slice():[], tier:m.tier||'', memo:m.memo||'',
          fb:m.fb||'', x:m.x||'', wiki:m.wiki||'', ph:m.ph||'', hiddenUntil:m.hiddenUntil||0};
}
function applyRecord(m, r){
  if(!r) return;
  if(r.fac  !== undefined) m.fac  = Array.isArray(r.fac) ? r.fac.slice() : [];
  if(r.tier !== undefined) m.tier = r.tier || '';
  if(r.memo !== undefined) m.memo = r.memo || '';
  if(r.fb   !== undefined) m.fb   = r.fb   || '';
  if(r.x    !== undefined) m.x    = r.x    || '';
  if(r.wiki !== undefined) m.wiki = r.wiki || '';
  // ph는 하드코딩 사진을 존중 — Firestore 빈 값은 무시 (덮어쓰지 않음)
  if(r.ph && r.ph.trim()) m.ph = r.ph;
  // hiddenUntil: 항상 반영 (0/null 도 유효 = 스킵 해제)
  if(r.hiddenUntil !== undefined) m.hiddenUntil = r.hiddenUntil || 0;
}
function writeCache(){
  let obj={}; D.members.forEach(m=>{ obj[m.row]=snapshotMember(m); });
  try{ localStorage.setItem(LS_KEY, JSON.stringify(obj)); }catch(e){ console.warn('캐시 저장 실패', e); }
}

function saveLocal(changedRow=null){
  if(changedRow!==null){ lastChangedRows.add(String(changedRow)); dirtyRows.add(String(changedRow)); }
  writeCache();

  if(!db){ setStatus('로컬에만 저장됨 (DB 미연결)','#FFF4CE',2500); return; }
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer=setTimeout(()=>{
    let rows=[...lastChangedRows];
    if(!rows.length) return;
    setStatus('저장중...','#FFF4CE');
    let sending=new Set(rows);
    let promises=rows.map(row=>{
      let mem=D.members.find(x=>String(x.row)===String(row));
      if(!mem) return Promise.resolve(null);
      let rec=snapshotMember(mem);
      let docId=`${row}_${mem.nm}`;
      let ts=firebase.firestore.FieldValue.serverTimestamp();
      // 객관 정보(FB·X·위키·사진) → 공유 컬렉션(root/politicians). 모든 고객사가 함께 봄.
      let writes=[ sharedPoliticiansCol().doc(docId).set({
        fb:rec.fb, x:rec.x, wiki:rec.wiki||'', ...(rec.ph ? {ph:rec.ph} : {}),
        name:mem.nm, id:docId, updatedAt:ts
      },{merge:true}) ];
      if(SNS_NS==='shared'){
        // 하위호환: 비로그인/구세션은 계파·티어·메모도 root에 그대로
        writes.push( sharedPoliticiansCol().doc(docId).set({
          factions:rec.fac, tier:rec.tier, memo:rec.memo, ...(mem.hiddenUntil ? {hiddenUntil:mem.hiddenUntil} : {}),
          name:mem.nm, id:docId, updatedAt:ts
        },{merge:true}) );
      }else{
        // 주관 정보(계파·티어·메모·피드숨김) → 고객사별 칸
        writes.push( politiciansCol().doc(docId).set({
          factions:rec.fac, tier:rec.tier, memo:rec.memo, ...(mem.hiddenUntil ? {hiddenUntil:mem.hiddenUntil} : {}),
          name:mem.nm, id:docId, updatedAt:ts
        },{merge:true}) );
      }
      return Promise.all(writes).then(()=>({nm:mem.nm, rec}));
    });
    Promise.all(promises).then(rs=>{
      let ok=rs.filter(Boolean);
      let last=ok[ok.length-1];
      setStatus('DB 저장됨: '+(last?last.nm:'')+(last&&last.rec.fac.length?' ['+last.rec.fac.join(',')+']':''),'#E6F4EA',2500);
      sending.forEach(r=>{ lastChangedRows.delete(r); dirtyRows.delete(r); });
      // 편집자가 저장한 순간이 곧 최신 시점 → 다음 증분 로드의 기준을 여기로
      setSyncMeta({lastSyncMs:Date.now()});
    }).catch(e=>{
      console.warn('DB 저장 실패', e);
      // 사라지지 않게 유지 — 다음 저장이 성공하면 그때 덮어써짐
      setStatus('⚠ DB 저장 실패 — 이 브라우저에만 보관됨. 권한이 없거나 연결이 끊겼어요.','#FCE8E6');
    });
  },300);
}

// 증분 로드: updatedAt > lastSyncMs 인 문서만 받아옴
// full=true 이면 캐시 무시하고 전체 재로드 (다른 기기에서 편집했을 때 대비)
async function loadFromFirestore(opts){
  opts=opts||{};
  if(!db){ setStatus('DB 미연결 (로컬 저장만)','#FFF4CE'); return; }
  let meta=getSyncMeta();
  let sinceMs = opts.full ? 0 : (meta.lastSyncMs||0);
  try{
    let sinceTs = sinceMs>0 ? firebase.firestore.Timestamp.fromMillis(sinceMs) : null;
    let fetchCol = (col)=>{ let q=col; if(sinceTs) q=q.where('updatedAt','>',sinceTs); return q.get(); };
    let sameCol = (SNS_NS==='shared');   // 이 경우 politiciansCol() === sharedPoliticiansCol()
    let [sharedSnap, cliSnap] = sameCol
      ? await fetchCol(politiciansCol()).then(s=>[s,s])
      : await Promise.all([ fetchCol(sharedPoliticiansCol()), fetchCol(politiciansCol()) ]);
    let index = (snap)=>{
      let byId={}, byName={};
      snap.forEach(doc=>{
        let d=doc.data();
        let name=d.name||doc.id.split('_').slice(1).join('_')||doc.id;
        byId[doc.id]=d; byName[name]=d;
      });
      return {byId, byName};
    };
    let S=index(sharedSnap), C=index(cliSnap);
    let pick=(idx,m)=> idx.byId[`${m.row}_${m.nm}`] || idx.byName[m.nm] || idx.byId[m.nm]
                       || (m.legacyNm ? idx.byId[`${m.row}_${m.legacyNm}`] : undefined);
    let touched=0;
    D.members.forEach(m=>{
      if(dirtyRows.has(String(m.row))) return;
      let sd=pick(S,m), cd=pick(C,m);
      if(!sd && !cd) return;
      // 객관 정보 = 공유 컬렉션
      if(sd) applyRecord(m, { fb: sd.fb, x: sd.x, wiki: sd.wiki, ph: sd.ph });
      // 주관 정보 = 고객사 칸 (shared 모드면 같은 문서)
      let cc = cd || (sameCol ? sd : null);
      if(cc) applyRecord(m, {
        fac : cc.factions!==undefined ? cc.factions : cc.fac,
        tier: cc.tier, memo: cc.memo, hiddenUntil: cc.hiddenUntil
      });
      touched++;
    });
    _fsLoaded=true;
    if(touched>0){ writeCache(); buildFilters(); draw(); }
    setSyncMeta({lastSyncMs:Date.now()});
    let readCount = sharedSnap.size + (sameCol ? 0 : cliSnap.size);
    let mode = opts.full ? '전체' : (sinceMs>0 ? '증분' : '초기');
    if(opts.userTriggered){
      setStatus(`동기화 완료 (${mode} · 읽기 ${readCount}건)`,'#E6F4EA',2500);
    }else{
      defaultStatus();
    }
  }catch(e){
    console.warn('DB 로드 실패', e);
    // updatedAt 인덱스 없음 등의 이유로 실패하면 전체 로드로 폴백
    if(!opts.full && /index|updatedAt/i.test(e.message||'')){
      console.warn('증분 로드 실패 → 전체 로드로 폴백');
      return loadFromFirestore({full:true, userTriggered:opts.userTriggered});
    }
    setStatus('⚠ DB 로드 실패 — 캐시로 표시중','#FCE8E6',6000);
  }
}

function countBy(){
  let partyCounts={}; D.members.forEach(m=>{partyCounts[m.p]=(partyCounts[m.p]||0)+1;});
  let facCounts={}; D.members.forEach(m=>{(m.fac||[]).forEach(f=>{ if(f==='비례') return; facCounts[f]=(facCounts[f]||0)+1;});});
  // 비례 count — isProp 이거나 fac에 '비례'가 있는 의원 수(중복 없이)
  let propCount = D.members.filter(m=>m.isProp || (m.fac||[]).includes('비례')).length;
  facCounts['비례']=propCount;
  let tierCounts={}; D.members.forEach(m=>{if(m.tier){tierCounts[m.tier]=(tierCounts[m.tier]||0)+1;}});
  return {partyCounts, facCounts, tierCounts, propCount};
}

function buildFilters(){
  let {partyCounts, facCounts, tierCounts} = countBy();
  let parties=[...new Set(D.members.map(m=>m.p))].filter(Boolean).sort((a,b)=>(partyCounts[b]||0)-(partyCounts[a]||0));
  // 현재 활성 필터 값은 카운트 0이어도 버튼을 유지한다 — 안 그러면 데이터가 바뀌어
  // 그 값이 사라졌을 때 필터가 켜진 채로 버튼만 없어져서 해제할 방법이 없어짐(유령 필터).
  parties=[...new Set([...parties, ...F.party])];
  $('fParty').innerHTML=parties.map(p=>'<button class="fTag" data-k="party" data-v="'+esc(p)+'" title="'+esc(p)+'"><span style="width:9px;height:9px;border-radius:50%;background:'+(PARTY_COLOR[p]||'#888')+';display:inline-block"></span>'+esc(PARTY_SHORT[p]||p)+' <span class="cnt">'+(partyCounts[p]||0)+'</span></button>').join('');
  // 계파: 첫 번째는 비례 고정, 나머지는 기존 fac + local + 현재 활성 필터
  let local=getLocal(); let localFacs=Object.values(local).flatMap(o=>o.fac||[]);
  let allFac=[...new Set([...D.members.flatMap(m=>m.fac||[]), ...localFacs, ...F.fac])].filter(f=>f!=='비례').sort();
  let facOrder=['비례', ...allFac];
  $('fFac').innerHTML=facOrder.map(f=>'<button class="fTag" data-k="fac" data-v="'+esc(f)+'">'+esc(f)+' <span class="cnt">'+(facCounts[f]||0)+'</span></button>').join('');
  // 티어 = 라디오(단일 선택), 기본 '전체'
  $('fTier').innerHTML='<button class="tierRadio" data-v="">전체</button>'
    + ['1','2','3'].map(t=>'<button class="tierRadio" data-v="'+t+'">티어 '+t+' <span class="cnt">'+(tierCounts[t]||0)+'</span></button>').join('');
  $('fTier').querySelectorAll('.tierRadio').forEach(btn=>{
    let v=btn.dataset.v;
    btn.classList.toggle('on', v==='' ? F.tier.length===0 : F.tier.includes(v));
    btn.onclick=function(){
      hasFiltered=true;
      F.tier = v==='' ? [] : [v];
      buildFilters();
      draw();
    };
  });
  document.querySelectorAll('.fTag').forEach(btn=>{
    let k=btn.dataset.k, v=btn.dataset.v;
    if(!k||!Array.isArray(F[k])) return;   // stray .fTag 방어 (syncFilterButtons와 동일)
    btn.classList.toggle('on', F[k].includes(v));
    btn.onclick=function(){
      hasFiltered=true;
      let arr=F[k];let idx=arr.indexOf(v);if(idx>=0)arr.splice(idx,1);else arr.push(v);
      btn.classList.toggle('on',arr.includes(v));
      buildFilters();   // 활성 필터 해제 시 카운트0 유령 버튼도 같이 정리되도록 재빌드
      draw();
    };
  });
}

function pick(){
  let q=(F.q||'').toLowerCase().trim();
  return D.members.filter(m=>{
    if(F.party.length&&!F.party.includes(m.p))return false;
    if(F.fac.length){
      // 비례 특별 처리
      let has=false;
      for(let f of F.fac){
        if(f==='비례'&&m.isProp){has=true;break;}
        if((m.fac||[]).includes(f)){has=true;break;}
      }
      if(!has)return false;
    }
    if(F.tier.length&&!F.tier.includes(String(m.tier||'')))return false;
    if(F.rg.length&&!F.rg.includes(m.rg))return false;
    if(F.sido.length){
      let sd=getSido(m.rg,m.isProp);
      if(!sd || !F.sido.includes(sd))return false;
    }
    if(!memberInRegion(m))return false;
    if(q){let hay=[m.nm,m.p,m.rg,m.region,m.comm,(m.fac||[]).join(','),m.memo,m.isProp?'비례':'' ].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}

        saveLocal(row);
      }
      fl.classList.remove('flipped');
    }
  });
}, true);

// Facebook iframe 높이 자동 조절 - 내부 스크롤 제거 핵심
window.addEventListener('message', function(e){
  try{
    if(!e.origin.includes('facebook.com')) return;
    let data=e.data;
    if(typeof data==='string' && data.includes('height')){
      // data like {type:'resize', height:xxx}
    }
    // Facebook SDK가 보내는 resize 메시지 파싱
    if(data && data.height){
      document.querySelectorAll('.feedClip iframe').forEach(ifr=>{
        if(ifr.contentWindow===e.source){
          let newH=Math.min(1200, Math.max(300, parseInt(data.height,10)+40));
          ifr.style.height=newH+'px';
          let clip=ifr.closest('.feedClip');
          if(clip) clip.style.height=newH+'px';
        }
      });
    }
  }catch(err){}
});






let _preFeedScrollY=null;   // 포스팅 보기 직전 스크롤 위치

function closeFeed(){
  let bf=$('bottomFeed'); if(bf) bf.style.display='none';
  if(_preFeedScrollY!==null){
    let y=_preFeedScrollY; _preFeedScrollY=null;
    window.scrollTo({top:y, behavior:'smooth'});
  }
}

function scrollToFeed(){
  let bf=$('bottomFeed'); if(!bf) return;
  if(_preFeedScrollY===null) _preFeedScrollY=window.pageYOffset;
  let hdr=document.querySelector('.header');
  let off=hdr?hdr.getBoundingClientRect().height:0;
  // 레이아웃이 잡힌 뒤 위치를 계산해야 정확하다
  requestAnimationFrame(()=>{
    let top=bf.getBoundingClientRect().top+window.pageYOffset-off;
    window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  });
}

// 개인 계정 카드의 "최신 글" 영역을 Worker(/fbposts)에서 채운다.
// FB_COOKIE 미설정이면 조용히 버튼만 남긴다. 동시 요청 폭주 방지로 살짝 시차.
async function loadProfilePosts(){
  let boxes=[...document.querySelectorAll('#feedList .profilePosts[data-fb-vanity]')];
  for(let i=0;i<boxes.length;i++){
    let box=boxes[i], v=box.dataset.fbVanity;
    if(!v){ box.innerHTML='<span class="ppNote">주소를 인식하지 못했습니다</span>'; continue; }
    if(i>0) await new Promise(r=>setTimeout(r,450));
    try{
      let res=await fetch(FB_WORKER+'/fbposts?u='+encodeURIComponent(v));
      let j=await res.json();
      if(j && j.needsCookie){ box.innerHTML=''; continue; }
      let posts=(j && j.posts) || [];
      if(!posts.length){ box.innerHTML='<span class="ppNote">최근 글을 가져오지 못했습니다</span>'; continue; }
      box.innerHTML='<div class="profilePostsHead">최신 글</div>'
        + posts.slice(0,5).map(p=>'<div class="profilePost">'+esc(p.text||'')+'</div>').join('');
    }catch(e){ box.innerHTML='<span class="ppNote">최근 글을 가져오지 못했습니다</span>'; }
  }
}

/* ===== X 보기 — 요청/처리 큐 방식 (정적 호스팅이라 즉시 검색 불가) =====
   sns_u/{SNS_NS}/x_requests에 요청을 쌓으면 컴퓨터에서 도는 watch_requests.py가
   집어서 처리하고 sns_u/{SNS_NS}/x_reports에 결과를 쓴다. 여기선 그 상태를 폴링. */
// x-search-worker: Firefox에서 뽑아 Worker Secret으로 저장해둔 X 로그인 세션으로
// 즉시 검색해주는 Cloudflare Worker. 로컬 스크립트도, 대기도 필요 없다.
const X_SEARCH_WORKER_URL = 'https://x-search-worker.YOUR-ACCOUNT.workers.dev/search';

let xFeedState=null;   // {status:'form'|'loading'|'done'|'error', topic, days, result, error}
function resetXFeedState(){
  xFeedState={status:'form'};
}

function renderXFeed(){
  let body=$('feedBody');
  if(!xFeedState) resetXFeedState();
  // 공방은 여야·계파를 넘나든다 — 카드 필터/체크선택은 "포스팅 보기"를 열 때 화면에
  // 어떤 사람이 보였는지일 뿐, X 검색 대상은 항상 X계정 등록된 의원 전원으로 한다.
  // (그래야 필터링한 쪽에서만 검색해서 상대 진영 발언을 놓치는 일이 없다.)
  let hiddenMems=getHiddenMembers();
  let selWithX=D.members.filter(m=>!hiddenMems[m.row] && !isFeedHidden(m) && (m.x||'').trim()!=='');

  if(selWithX.length===0){
    body.innerHTML='<div class="xFeedEmpty">X 계정이 등록된 의원이 아직 없습니다.<br>카드 뒷면에서 X 링크를 입력해주세요.</div>';
    return;
  }

  // 검색창은 로딩/결과/에러 어떤 상태든 항상 위에 떠 있고, 지금 검색어가 채워져 있어서
  // 바로 고쳐서 다시 검색할 수 있다 ("새로 검색" 버튼으로 따로 초기화할 필요 없음).
  let barHtml='<div class="xFeedAskRow">'
    +   '<input id="xFeedTopicInput" placeholder="키워드 / 이슈 (예: 탄핵)" value="'+esc(xFeedState.topic||'')+'">'
    +   '<input id="xFeedDaysInput" type="number" value="'+esc(String(xFeedState.days||7))+'" min="1" style="width:60px">'
    +   '<span>일</span>'
    +   '<button class="btn primary" id="xFeedAskBtn">'+(xFeedState.status==='loading'?'검색 중…':'검색')+'</button>'
    +   '<span class="xFeedBarNote">대상 '+selWithX.length+'명</span>'
    + '</div>'
    + '<div class="xFeedErr" id="xFeedErr" style="display:none"></div>';

  let contentHtml='';
  if(xFeedState.status==='form'){
    contentHtml='<p class="xFeedNote">키워드를 입력하면 최근 게시글 중 언급된 것만 계파별로 정리해 보여줍니다.</p>';
  }else if(xFeedState.status==='loading'){
    contentHtml='<div class="xFeedPending"><div class="xFeedSpinner"></div>"'+esc(xFeedState.topic)+'" 검색 중… ('
      + esc(String(xFeedState.targetCount))+'명, 보통 5~15초)</div>';
  }else if(xFeedState.status==='done'){
    contentHtml=xFeedResultHtml(xFeedState.result);
  }else if(xFeedState.status==='error'){
    let errMsg = /시크릿이 설정/.test(xFeedState.error||'')
      ? 'X 로그인 정보가 아직 연결 안 됐습니다 (컴퓨터에서 Worker에 AUTH_TOKEN/CT0 설정 필요)'
      : '검색 실패: '+(xFeedState.error||'');
    contentHtml='<div class="xFeedEmpty">'+esc(errMsg)+'</div>';
  }
  body.innerHTML='<div class="xFeedAsk">'+barHtml+'</div>'+contentHtml;

  let topicInput=$('xFeedTopicInput'), daysInput=$('xFeedDaysInput'), askBtn=$('xFeedAskBtn'), errBox=$('xFeedErr');
  let loading=(xFeedState.status==='loading');
  topicInput.disabled=loading; daysInput.disabled=loading; askBtn.disabled=loading;
  let showErr=(msg)=>{
    errBox.textContent=msg; errBox.style.display='block';
    topicInput.classList.add('errShake');
    setTimeout(()=>topicInput.classList.remove('errShake'), 400);
    topicInput.focus();
  };
  let submit=function(){
    let topic=topicInput.value.trim();
    let days=parseInt(daysInput.value,10)||7;
    if(!topic){ showErr('키워드를 먼저 입력해주세요.'); return; }
    runXFeedSearch(selWithX, topic, days);
  };
  askBtn.onclick=submit;
  topicInput.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  topicInput.oninput=function(){ if(errBox.style.display!=='none') errBox.style.display='none'; };

  if(xFeedState.status==='done'){
    let aiBtn=document.getElementById('xfAiBtn');
    if(aiBtn) aiBtn.onclick=function(){ runXFeedAiSummary(xFeedState.result); };
  }
}

// Worker는 요청 하나당 25명까지만 처리한다(Cloudflare 하위요청 상한). 대상이 그보다 많으면
// 여러 번 나눠 호출해서 합쳐야 하는데, 그러면 "이 청크 안에서만" 멘션을 본 서버가
// 다른 청크에 있는 동료를 향한 멘션(공방)을 놓친다 — 그래서 directed_at은 전체 명단
// 기준으로 여기서 다시 계산한다. people.html의 "공방" 탭도 이 함수를 그대로 가져다 쓴다.
window.searchXChunked = async function(targets, topic, days, chunkSize){
  chunkSize = chunkSize || 25;
  const chunks = [];
  for(let i=0;i<targets.length;i+=chunkSize) chunks.push(targets.slice(i,i+chunkSize));
  let allPosts = [];
  const failedAccounts = [];
  const failedChunks = [];
  for(const chunk of chunks){
    try{
      const res = await fetch(X_SEARCH_WORKER_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ topic, days, targets: chunk })
      });
      const data = await res.json();
      if(res.ok && Array.isArray(data.posts)) allPosts = allPosts.concat(data.posts);
      if(res.ok && Array.isArray(data.failed_details)) failedAccounts.push(...data.failed_details);
      else failedChunks.push(data.error || ('HTTP '+res.status));
    }catch(e){ failedChunks.push(e.message); }
  }
  // 전체 명단 기준으로 directed_at 재계산 (청크 경계를 넘는 멘션도 잡히도록)
  const byHandle = {};
  targets.forEach(t=>{
    let h = (t.x||'').trim();
    if(h.startsWith('http')) h = h.replace(/\/+$/,'').split('/').pop().replace(/^@/,'');
    if(h) byHandle[h.toLowerCase()] = t.name;
  });
  allPosts.forEach(p=>{
    const mentioned = p.mentioned_handles || [];
    p.directed_at = mentioned.filter(m=>byHandle[m]).map(m=>byHandle[m]);
  });
  allPosts.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const byFaction = {};
  allPosts.forEach(p=>{
    (p.factions&&p.factions.length ? p.factions : ['(계파 미입력)']).forEach(f=>{ byFaction[f]=(byFaction[f]||0)+1; });
  });
  const exchanges = allPosts.filter(p=>p.directed_at && p.directed_at.length);
  return {
    topic, window_days: days, total_matched_posts: allPosts.length,
    posts: allPosts, by_faction: byFaction, exchanges,
    _chunkErrors: failedChunks,
    failed_accounts: failedAccounts
  };
};

async function runXFeedSearch(members, topic, days){
  let targets=members.map(m=>({ name:m.nm, x:m.x, factions:m.fac||[] }));
  xFeedState={ status:'loading', topic, days, targetCount:targets.length };
  renderXFeed();
  try{
    let data = await window.searchXChunked(targets, topic, days);
    if(data._chunkErrors && data._chunkErrors.length && data.posts.length===0){
      throw new Error(data._chunkErrors[0]);
    }
    xFeedState={ status:'done', topic, days, result: data };
  }catch(e){
    console.error(e);
    xFeedState={ status:'error', error: e.message };
  }
  renderXFeed();
}

function xFeedPostCardHtml(p){
  let arrow=(p.directed_at && p.directed_at.length) ? ' <span class="xfArrow">→ '+esc(p.directed_at.join(', '))+'</span>' : '';
  let eng=p.engagement||{};
  let engParts=[];
  if(eng.likes!=null) engParts.push('좋아요 '+eng.likes);
  if(eng.reposts!=null) engParts.push('RT '+eng.reposts);
  if(eng.replies!=null) engParts.push('답글 '+eng.replies);
  return '<div class="xfPost"><div class="xfPostHead"><b>'+esc(p.name||'')+'</b>'+arrow+'<span class="xfPostDate">'+esc(p.date||'')+'</span></div>'
    + '<div class="xfPostText">'+esc(p.text||'')+'</div>'
    + '<div class="xfPostFoot">'+(engParts.length?'<span>'+esc(engParts.join(' · '))+'</span>':'<span></span>')+'<a href="'+esc(p.url||'#')+'" target="_blank" rel="noopener">원문 보기 ↗</a></div></div>';
}

function xFeedResultHtml(r){
  if(!r || !r.posts || !r.posts.length){
    return '<div class="xFeedEmpty">"'+esc((r&&r.topic)||'')+'" 관련 언급을 찾지 못했습니다.</div>';
  }
  let byFaction={};
  r.posts.forEach(p=>{
    let facs=(p.factions && p.factions.length) ? p.factions : ['(계파 미입력)'];
    facs.forEach(f=>{ (byFaction[f]=byFaction[f]||[]).push(p); });
  });
  let order=Object.keys(byFaction).sort((a,b)=>byFaction[b].length-byFaction[a].length);
  let exchanges=r.posts.filter(p=>p.directed_at && p.directed_at.length);

  let html='<div class="feedSubTitle">"'+esc(r.topic)+'" 최근 '+esc(String(r.window_days||''))+'일 · 총 '+esc(String(r.total_matched_posts||0))+'건</div>';
  html+='<div class="xfAiBlock"><button class="btn primary" id="xfAiBtn">🤖 이슈 설명 + 공방 정리 (AI)</button><div id="xfAiResult"></div></div>';
  if(exchanges.length){
    html+='<div class="xfSection xfExchange"><div class="xfSectionTitle">동료 의원을 직접 겨냥한 언급 (공방 후보) '+exchanges.length+'건</div>'
      + exchanges.map(xFeedPostCardHtml).join('') + '</div>';
  }
  order.forEach(f=>{
    html+='<div class="xfSection"><div class="xfSectionTitle">'+esc(f)+' <span class="xfCnt">'+byFaction[f].length+'건</span></div>'
      + byFaction[f].map(xFeedPostCardHtml).join('') + '</div>';
  });
  return html;
}

// ===== AI 요약: 이슈 설명 + 계파별 공방 정리 (Gemini, 정글2 스크랩 요약과 같은 무료 키 재사용) =====
// sns-tool.html은 빌드 시 해시 파일명 치환 대상이 아니라(script.mjs 참고) config.js를
// 외부 참조로 못 쓴다 — 이 파일이 이미 firebaseConfig를 따로 갖고 있는 것과 같은 이유로,
// Gemini 키도 config.js 값을 그대로 복붙해 둔다(무료 티어 키라 노출 비용 위험 없음 — config.js 주석과 동일).
// config.js의 geminiApiKey를 바꾸면 여기도 같이 바꿔야 함.
const GEMINI_API_KEY_XFEED='';
const GEMINI_MODEL_XFEED='gemini-3.5-flash-lite';
function geminiXFeedUrl(){
  return 'https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL_XFEED+':generateContent?key='+GEMINI_API_KEY_XFEED;
}
function buildXFeedAiPrompt(r){
  let lines=r.posts.map(p=>{
    let who=p.name+(p.factions&&p.factions.length?' ('+p.factions.join(',')+')':'')
      +(p.directed_at&&p.directed_at.length?' → '+p.directed_at.join(', ')+' 향':'');
    return '- ['+(p.date||'')+'] '+who+': '+(p.text||'').replace(/\s+/g,' ');
  }).join('\n');
  return '당신은 정치 뉴스 기사를 쓰는 기자를 돕는 어시스턴트입니다. "'+r.topic+'" 이슈에 대해 국회의원들이 최근 '
    + (r.window_days||'')+'일간 X(트위터)에 올린 게시글 목록입니다.\n\n'
    + '아래 형식으로 정리해주세요(마크다운 제목 없이 그냥 줄바꿈으로 구분):\n'
    + '1. 이슈 설명 — 게시글 내용을 바탕으로 이 논쟁이 무엇에 대한 것인지 2~3문장 배경 설명\n'
    + '2. 계파/정당별 입장 — 각 계파·정당이 어떤 입장을 취하는지 정리\n'
    + '3. 주요 공방 — 의원들 사이 구체적으로 어떤 발언이 오갔는지, 누가 누구를 겨냥했는지 시간순으로 정리. 실제 발언은 큰따옴표로 인용\n\n'
    + '게시글 목록:\n'+lines;
}
async function runXFeedAiSummary(r){
  let btn=document.getElementById('xfAiBtn'), out=document.getElementById('xfAiResult');
  if(!btn || !out) return;
  btn.disabled=true; btn.textContent='정리 중…';
  out.innerHTML='<div class="xfAiLoading"><div class="xFeedSpinner"></div>AI가 이슈와 공방을 정리하는 중…</div>';
  try{
    let res=await fetch(geminiXFeedUrl(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ parts:[{ text: buildXFeedAiPrompt(r) }] }] })
    });
    let data=await res.json();
    if(!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP '+res.status));
    let cand=data && data.candidates && data.candidates[0];
    let text=(cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text || '').trim();
    if(!text) throw new Error('응답이 비었습니다');
    out.innerHTML='<div class="xfAiText">'+esc(text).replace(/\n/g,'<br>')+'</div>';
  }catch(e){
    console.error(e);
    out.innerHTML='<div class="xfAiErr">AI 정리 실패: '+esc(e.message)+'</div>';
  }
  btn.disabled=false; btn.textContent='🤖 이슈 설명 + 공방 정리 (AI)';
}

// --- 미배선 버튼 배선 (백업) ---

(function(){
  let bk=document.getElementById('backupBtn');
  if(bk) bk.onclick=function(){
    let payload={
      exportedAt:new Date().toISOString(),
      count:D.members.length,
      members:D.members
        .filter(m=>(m.fac&&m.fac.length)||m.tier||m.memo||m.fb||m.x)
        .map(m=>({row:m.row,nm:m.nm,p:m.p,fac:m.fac||[],tier:m.tier||'',memo:m.memo||'',fb:m.fb||'',x:m.x||'',ph:m.ph||''}))
    };
    let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    let d=new Date(), pad=n=>String(n).padStart(2,'0');
    a.href=url;
    a.download='sns_backup_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setStatus('백업 저장됨 ('+payload.members.length+'명)','#E6F4EA',2500);
  };
})();
